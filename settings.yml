use_default_settings: true

general:
  instance_name: "AVKEAN Search"
  contact_url: https://avkean.com

brand:
  issue_url: https://github.com/avkean/searxng/issues
  new_issue_url: https://github.com/avkean/searxng/issues/new

search:
  autocomplete: kagi
  autocomplete_min: 1
  suspended_times:
    SearxEngineCaptcha: 60

preferences:
  lock:
    - image_proxy

categories_as_tabs:
  general:
  images:
  videos:
  news:

engines:
  - name: google
    disabled: false
    inactive: false
    engine: google_stateless
    # searxng-google is plain HTTP inside the Docker network
    enable_http: true
    # a browser search takes a second or two
    timeout: 6.0
    retries: 0
    retry_on_http_error: false
  - name: google cse
    disabled: true
  # Bing results were mostly irrelevant
  - name: bing
    disabled: true
    inactive: true
  - name: duckduckgo web
    disabled: false
    retries: 0
    retry_on_http_error: false
  # fallback for when Google is suspended
  - name: brave
    engine: brave_web
    disabled: false
    retries: 0
    retry_on_http_error: false
  - name: duckduckgo
    disabled: true
  - name: startpage
    disabled: true
  - name: wikidata
    disabled: true
  - name: wikipedia
    disabled: true
