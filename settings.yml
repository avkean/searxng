use_default_settings: true

general:
  instance_name: "AVKEAN Search"
  contact_url: https://avkean.com

brand:
  issue_url: https://github.com/avkean/searxng/issues
  new_issue_url: https://github.com/avkean/searxng/issues/new

search:
  # SearXNG's "auto" follows the browser's language. For en-SG it then tries
  # each Singapore language for Wikipedia, and the first one with a Singapore
  # variant is Chinese, so the info card comes back in Chinese. "all" leaves
  # the language to each engine.
  default_lang: all
  autocomplete: kagi
  autocomplete_min: 1
  # Site icons next to results. The server fetches and caches them, so
  # visitors never contact DuckDuckGo.
  favicon_resolver: duckduckgo
  # Blocks are mostly one-offs now, so pause an engine for a minute, not
  # hours. MetaCrawler sits behind Cloudflare.
  suspended_times:
    SearxEngineAccessDenied: 60
    SearxEngineCaptcha: 60
    cf_SearxEngineAccessDenied: 60
    cf_SearxEngineCaptcha: 60

preferences:
  lock:
    - image_proxy

# This list replaces SearXNG's own, so it repeats the defaults. The only
# change is infinite scroll: the next page loads as you scroll.
plugins:
  searx.plugins.calculator.SXNGPlugin:
    active: true
  searx.plugins.infinite_scroll.SXNGPlugin:
    active: true
  searx.plugins.hash_plugin.SXNGPlugin:
    active: true
  searx.plugins.self_info.SXNGPlugin:
    active: true
  searx.plugins.unit_converter.SXNGPlugin:
    active: true
  searx.plugins.ahmia_filter.SXNGPlugin:
    active: true
  searx.plugins.hostnames.SXNGPlugin:
    active: true
  searx.plugins.time_zone.SXNGPlugin:
    active: true
  searx.plugins.oa_doi_rewrite.SXNGPlugin:
    active: false
  searx.plugins.tor_check.SXNGPlugin:
    active: false
  searx.plugins.tracker_url_remover.SXNGPlugin:
    active: true

categories_as_tabs:
  general:
  images:
  videos:
  news:

engines:
  # Google's results, from System1. It takes the region from the server's
  # IP. Google's order leads, the other engines fill in. Higher than 4 only
  # pushes out useful extras from DuckDuckGo.
  - name: metacrawler
    disabled: false
    inactive: false
    weight: 4
    # Cloudflare turns away the odd request, a second try gets through
    retries: 1
    retry_on_http_error: [403]
  # Google blocks almost every request from anything that isn't a full
  # browser. Kept on so a fix in upstream SearXNG arrives with the nightly
  # update. Google gives the server's IPv4 address much worse results.
  - name: google
    disabled: false
    inactive: false
    network: ipv6
    weight: 4
    timeout: 3.0
    retries: 0
    retry_on_http_error: false
  # Google's Programmable Search. Its whole-web search ends on 1 Jan 2027.
  - name: google cse
    disabled: false
    inactive: false
    retries: 0
    retry_on_http_error: false
  # Bing results were mostly irrelevant
  - name: bing
    disabled: true
    inactive: true
  - name: duckduckgo web
    disabled: false
    # With the default Firefox fingerprint, DuckDuckGo answers the server
    # with its bot check page
    impersonate: chrome
    retries: 0
    retry_on_http_error: false
  - name: brave
    disabled: true
  - name: duckduckgo
    disabled: true
  - name: startpage
    disabled: true
  # Wikipedia and Wikidata only fill the info card: Wikipedia the photo and
  # summary, Wikidata the facts. Wikidata is often the slowest engine, so a
  # short timeout drops the facts instead of slowing the search.
  - name: wikipedia
    disabled: false
    timeout: 1.5
  - name: wikidata
    disabled: false
    timeout: 1.0
